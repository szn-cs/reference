# BEGIN fedora-live-iso-sda (rewritten 2026-08-26, lives on sda6/ext4)
menuentry 'Fedora Live ISO (sda rescue)' --class fedora --class gnu-linux --class os {
    insmod part_gpt
    insmod ext2
    insmod iso9660
    insmod loopback
    search --no-floppy --fs-uuid --set=root 1fda95ca-0781-4d92-a83a-13af1eb17df5
    set isofile='/live/Fedora-Workstation-Live-44-1.7.x86_64.iso'
    loopback loop $isofile
    linux (loop)/boot/x86_64/loader/linux root=live:CDLABEL=Fedora-WS-Live-44 rd.live.image iso-scan/filename=$isofile
    initrd (loop)/boot/x86_64/loader/initrd
}
# END fedora-live-iso-sda
