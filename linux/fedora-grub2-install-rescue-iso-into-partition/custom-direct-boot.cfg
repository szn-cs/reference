# CONTINGENCY variant (rewritten 2026-08-26, lives on sda6/ext4)
# Only use if 03-extract-kernel-initrd.sh has been run: kernel + initrd are
# read directly from sda6 (ext4) — no GRUB loopback of the ISO at all. Dracut
# still locates the ISO at runtime via iso-scan/filename=.
# BEGIN fedora-live-iso-sda-direct (rewritten 2026-08-26)
menuentry 'Fedora Live ISO (sda rescue, direct)' --class fedora --class gnu-linux --class os {
    insmod part_gpt
    insmod ext2
    search --no-floppy --fs-uuid --set=root 1fda95ca-0781-4d92-a83a-13af1eb17df5
    set isofile='/live/Fedora-Workstation-Live-44-1.7.x86_64.iso'
    linux ($root)/live/boot/x86_64/loader/linux root=live:CDLABEL=Fedora-WS-Live-44 rd.live.image iso-scan/filename=$isofile
    initrd ($root)/live/boot/x86_64/loader/initrd
}
# END fedora-live-iso-sda-direct
